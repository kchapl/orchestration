          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_7C248226__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_C19C384F__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_76DF9333__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_77C1A4D2__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "{{#runtime-import .github/workflows/scala-lts-upgrade.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "agy"
          GH_AW_SUB_AGENT_DIR: ".agents/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
          GH_AW_SKILL_DIR: ".agents/skills"
          GH_AW_SKILL_EXT: "/SKILL.md"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'interpolate_prompt.cjs'));
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_76DF9333: ${{ github.event.pull_request.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'pull_request' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_77C1A4D2: ${{ github.event.comment.id || fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').comment_id }}
          GH_AW_EXPR_7C248226: ${{ github.event.issue.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'issue' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_C19C384F: ${{ github.event.discussion.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'discussion' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: '- `safeoutputs` — run `safeoutputs --help` to see available tools'
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require(path.join(actionsDir, 'substitute_placeholders.cjs'));

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_76DF9333: process.env.GH_AW_EXPR_76DF9333,
                GH_AW_EXPR_77C1A4D2: process.env.GH_AW_EXPR_77C1A4D2,
                GH_AW_EXPR_7C248226: process.env.GH_AW_EXPR_7C248226,
                GH_AW_EXPR_C19C384F: process.env.GH_AW_EXPR_C19C384F,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Inventory installed skills
        if: success() || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKILL_DIR: ".agents/skills"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'skill_inventory.cjs'));
            await main();
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.agents/agents
            /tmp/gh-aw/.agents/skills
            /tmp/gh-aw/skill_inventory.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1' }}

  agent:
    name: agent
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    # Permissions for the agent job (workflow permissions default to none).
    permissions:
      contents: none
      issues: read
      pull-requests: read
    timeout-minutes: 180
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_ENGINE_VERSION: "1.3.3"
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_TARGET_REPO_SLUG: ""
      GH_AW_WORKFLOW_ID_SANITIZED: scalaltsupgrade
    outputs:
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      model: ${{ needs.activation.outputs.model }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@458b269006dcf88e3b5496b6fbecabe4b9a0f954 # v0.92.0
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Scala LTS Upgrade"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/scala-lts-upgrade.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.3.3"
          GH_AW_INFO_AWF_VERSION: "v0.28.57"
          GH_AW_INFO_ENGINE_ID: "agy"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activation
          path: /tmp/gh-aw
      - env:
          GH_AW_INPUTS_MAX_REPOS: ${{ inputs.max_repos }}
          GH_AW_INPUTS_REPOS: ${{ inputs.repos }}
          SCALA_LTS_PAT: ${{ secrets.SCALA_LTS_PAT }}
        name: Resolve latest Scala LTS and build the repository plan
        run: "set -euo pipefail\nmkdir -p /tmp/gh-aw/data\npython3 - <<'PY'\nimport json, os, re, urllib.request\n\nDATA = \"/tmp/gh-aw/data\"\nTOKEN = os.environ.get(\"SCALA_LTS_PAT\") or \"\"\nUA = {\"User-Agent\": \"gh-aw-scala-lts-upgrade\"}\n\ndef get(url):\n    headers = dict(UA)\n    if TOKEN and url.startswith(\"https://api.github.com/\"):\n        # Anonymous REST reads are rate-limited and blind to private\n        # repositories; reuse the token the workflow already writes with.\n        headers[\"Authorization\"] = \"Bearer \" + TOKEN\n        headers[\"Accept\"] = \"application/vnd.github+json\"\n    with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as r:\n        return r.read().decode(\"utf-8\", \"replace\")\n\npage = get(\"https://www.scala-lang.org/download/\")\nlines = [tuple(map(int, m)) for m in re.findall(r\"(\\d+)\\.(\\d+)\\.x LTS\", page)]\nif not lines:\n    raise SystemExit(\"could not determine the current Scala LTS line\")\nlts_line = \"%d.%d\" % max(lines)\n\nmeta = get(\"https://repo1.maven.org/maven2/org/scala-lang/scala3-library_3/maven-metadata.xml\")\npatches = [tuple(map(int, v.split(\".\"))) for v in re.findall(r\"<version>([0-9][^<]*)</version>\", meta)\n           if re.fullmatch(re.escape(lts_line) + r\"\\.\\d+\", v)]\nif not patches:\n    raise SystemExit(\"no published patch release for Scala LTS line \" + lts_line)\nlts_version = \"%d.%d.%d\" % max(patches)\njson.dump({\"lts_line\": lts_line, \"lts_version\": lts_version}, open(f\"{DATA}/lts.json\", \"w\"), indent=2)\n\nrepos = [r for r in json.loads(get(\"https://api.github.com/users/kchapl/repos?per_page=100&type=owner\"))\n         if not r[\"archived\"] and not r[\"fork\"] and r[\"owner\"][\"login\"] == \"kchapl\"]\nwanted = [n.strip() for n in (os.environ.get(\"GH_AW_INPUTS_REPOS\") or \"\").split(\",\") if n.strip()]\nif wanted:\n    missing = sorted(set(wanted) - {r[\"name\"] for r in repos})\n    if missing:\n        raise SystemExit(\"requested repositories not found or not owned: \" + \", \".join(missing))\n    repos = [r for r in repos if r[\"name\"] in wanted]\n\ndef parts(version):\n    m = re.match(r\"(\\d+)\\.(\\d+)(?:\\.(\\d+))?\", version)\n    return tuple(int(x or 0) for x in m.groups()) if m else None\n\ndef classify(current, lts):\n    if not current:\n        return \"no_scala_version\"\n    c, l = parts(current), parts(lts)\n    if c is None or l is None:\n        return \"unparsed_version\"\n    if c == l:\n        return \"already_current\"\n    if c[0] < l[0]:\n        return \"major_upgrade\"\n    if c[0] > l[0] or c[:2] > l[:2]:\n        return \"ahead_of_lts\"\n    return \"upgrade\"\n\nplan = []\nfor r in sorted(repos, key=lambda x: x[\"name\"]):\n    name, branch = r[\"name\"], r[\"default_branch\"]\n    try:\n        build = get(f\"https://raw.githubusercontent.com/kchapl/{name}/{branch}/build.sbt\")\n    except Exception:\n        build = None\n\n    def declared_version(text):\n        # `scalaVersion := \"3.3.5\"`, and the sbt template's\n        # `val scala3Version = \"3.3.5\"` / `scalaVersion := scala3Version`.\n        # A dotted reference such as Dependencies.scalaVersion is not resolved.\n        if text is None:\n            return None\n        m = re.search(r'scalaVersion\\s*:?=\\s*\"([^\"]+)\"', text)\n        if m:\n            return m.group(1)\n        m = re.search(r'scalaVersion\\s*:?=\\s*([A-Za-z_][A-Za-z0-9_]*)', text)\n        if m:\n            val = re.search(r'(?:val|def)\\s+' + re.escape(m.group(1)) + r'\\s*(?::\\s*String\\s*)?=\\s*\"([^\"]+)\"', text)\n            if val:\n                return val.group(1)\n        return None\n\n    flags = sorted(set(re.findall(r'\"(-Werror|-Xfatal-warnings|-deprecation|-unchecked|-Wunused[^\"]*)\"', build or \"\")))\n    current = declared_version(build)\n    # A repository without a readable root build.sbt is reported, not dropped.\n    kind = classify(current, lts_version) if build is not None else \"unparsed_version\"\n    entry = {\n        \"repo\": name,\n        \"default_branch\": branch,\n        \"scala_version\": current,\n        \"compiler_flags\": flags,\n        \"kind\": kind,\n        \"open_upgrade_pr\": None,\n        \"previous_pr\": None,\n        \"pr_check_failed\": None,\n        \"needs_upgrade\": kind in (\"upgrade\", \"major_upgrade\"),\n        \"deferred\": False,\n    }\n    if entry[\"needs_upgrade\"]:\n        try:\n            prs = json.loads(get(f\"https://api.github.com/repos/kchapl/{name}/pulls?state=all&per_page=100\"))\n        except Exception as error:\n            # Without the PR list the plan cannot tell whether an upgrade is\n            # already open, and publishing with recreate-ref would delete the\n            # branch behind it. Block the repository instead of guessing.\n            entry[\"pr_check_failed\"] = str(error) or error.__class__.__name__\n            prs = None\n\n        def target_version(pr):\n            m = re.search(r\"Scala\\s+(\\d+\\.\\d+\\.\\d+)\", pr.get(\"title\") or \"\")\n            return m.group(1) if m else None\n\n        for pr in prs or []:\n            if pr[\"head\"][\"ref\"] != \"scala-lts-upgrade\":\n                continue\n            if pr[\"state\"] == \"open\":\n                entry[\"open_upgrade_pr\"] = {\"number\": pr[\"number\"], \"title\": pr[\"title\"], \"url\": pr[\"html_url\"]}\n                break\n            # A merged or declined pull request only settles the release it\n            # targeted: an upgrade to an older LTS must not block the next one.\n            # A title this workflow did not write keeps the conservative answer.\n            if target_version(pr) not in (None, lts_version):\n                continue\n            if entry[\"previous_pr\"] is None:\n                entry[\"previous_pr\"] = {\n                    \"state\": \"pr_merged\" if pr.get(\"merged_at\") else \"pr_closed\",\n                    \"number\": pr[\"number\"],\n                    \"title\": pr[\"title\"],\n                    \"url\": pr[\"html_url\"],\n                    \"target\": target_version(pr),\n                }\n    plan.append(entry)\n\nlimit_raw = (os.environ.get(\"GH_AW_INPUTS_MAX_REPOS\") or \"\").strip()\nlimit = min(int(limit_raw), 10) if limit_raw else 10\neligible = [e for e in plan\n            if e[\"needs_upgrade\"] and e[\"open_upgrade_pr\"] is None and not e[\"pr_check_failed\"]]\nfor e in eligible[limit:]:\n    e[\"deferred\"] = True\n\nfor e in plan:\n    if e[\"open_upgrade_pr\"]:\n        e[\"status\"] = \"pr_open\"\n    elif e[\"pr_check_failed\"]:\n        e[\"status\"] = \"pr_check_failed\"\n    elif e[\"previous_pr\"]:\n        e[\"status\"] = e[\"previous_pr\"][\"state\"]\n    elif not e[\"needs_upgrade\"]:\n        e[\"status\"] = e[\"kind\"]\n    elif e[\"deferred\"]:\n        e[\"status\"] = \"deferred\"\n    else:\n        e[\"status\"] = \"pending\"\n\ntracker = None\ntry:\n    repo_slug = os.environ[\"GITHUB_REPOSITORY\"]\n    for issue in json.loads(get(f\"https://api.github.com/repos/{repo_slug}/issues?state=open&per_page=100\")):\n        if issue[\"title\"].startswith(\"Scala LTS upgrade tracker\"):\n            tracker = {\"number\": issue[\"number\"], \"url\": issue[\"html_url\"]}\n            break\nexcept Exception:\n    pass\njson.dump({\"tracker_issue\": tracker}, open(f\"{DATA}/tracker.json\", \"w\"), indent=2)\nwith open(f\"{DATA}/pending.tsv\", \"w\") as fh:\n    for e in plan:\n        if e[\"status\"] == \"pending\":\n            fh.write(f\"{e['repo']}\\t{e['default_branch']}\\n\")\n\njson.dump(plan, open(f\"{DATA}/plan.json\", \"w\"), indent=2)\nprint(f\"target LTS {lts_version} (line {lts_line})\")\nprint(f\"{'repo':32} {'current':10} status\")\nfor e in plan:\n    print(f\"{e['repo']:32} {str(e['scala_version']):10} {e['status']}\")\nPY\n\ngit config --global user.name \"github-actions[bot]\"\ngit config --global user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\nmkdir -p \"$GITHUB_WORKSPACE/targets\"\nwhile IFS=$'\\t' read -r repo branch; do\n  [ -z \"$repo\" ] && continue\n  git clone --quiet --depth 1 --branch \"$branch\" \"https://github.com/kchapl/$repo.git\" \"$GITHUB_WORKSPACE/targets/$repo\"\n  git -C \"$GITHUB_WORKSPACE/targets/$repo\" checkout --quiet -B scala-lts-upgrade\n  echo \"prepared $repo (base $branch)\"\ndone < /tmp/gh-aw/data/pending.tsv"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.57 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".agents/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".agents/skills"
