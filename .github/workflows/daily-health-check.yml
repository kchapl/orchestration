name: Two-Phase Polyglot Health Check

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: Europe/London
  workflow_dispatch:

# Phase 2 shares one LLM quota across every repository, so overlapping manual
# runs would spend the same daily budget twice. Queue them instead.
concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # DISCOVERY: Fetch Non-Archived Repositories
  # ===========================================================================
  discover-repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch repository list via GitHub API
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          # --jq '.[]' emits one line per repo, which keeps --paginate output valid.
          REPOS=$(gh api user/repos --paginate \
            --jq '.[] | select(.archived == false and .fork == false) | .full_name')
          MATRIX=$(jq -nc --arg repos "$REPOS" '{
            repo: ($repos | split("\n") | map(select(length > 0)))
          }')
          COUNT=$(jq '.repo | length' <<<"$MATRIX")
          echo "Discovered $COUNT repositories"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No auditable repositories discovered; refusing to run an empty matrix"
            exit 1
          fi
          if [ "$COUNT" -gt 256 ]; then
            echo "::warning::Truncating matrix to 256 repositories (GitHub job limit)"
            MATRIX=$(jq -c '.repo |= .[:256]' <<<"$MATRIX")
            COUNT=256
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # PHASE 1: AUDIT & ISSUE CREATION
  # ===========================================================================
  audit-and-raise-issues:
    name: audit ${{ matrix.repo }}
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-repos.outputs.matrix) }}

    steps:
      # The audit logic lives in this repo so it can be run and tested locally.
      - name: Checkout health-check tooling
        uses: actions/checkout@v7.0.1
        with:
          path: .orchestrator

      - name: Checkout target repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          path: target

      - name: Run audit sensors and raise issue
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          REPO: ${{ matrix.repo }}
          TARGET_DIR: ${{ github.workspace }}/target
          AUDIT_RECORD_DIR: ${{ github.workspace }}/audit-records
        run: bash .orchestrator/.github/scripts/audit-repo.sh

      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-record-${{ strategy.job-index }}
          path: ${{ github.workspace }}/audit-records
          if-no-files-found: warn
          retention-days: 1

  # ===========================================================================
  # SUMMARY: Cross-Repo Inventory Report
  # ===========================================================================
  report:
    name: summary
    needs: [discover-repos, audit-and-raise-issues]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout health-check tooling
        uses: actions/checkout@v7.0.1
        with:
          path: .orchestrator

      # Advisory input only: a run with no records still renders a summary.
      - name: Collect audit records
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: audit-record-*
          path: audit-records
          merge-multiple: true

      - name: Write run summary
        run: bash .orchestrator/.github/scripts/render-report.sh audit-records >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # DISCOVER REMEDIATION: Only schedule repositories with an open health issue.
  # ===========================================================================
  find-remediation:
    needs: [discover-repos, audit-and-raise-issues]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.remediation.outputs.matrix }}
      has_work: ${{ steps.remediation.outputs.has_work }}
    steps:
      - name: Checkout health-check tooling
        uses: actions/checkout@v7.0.1
        with:
          path: .orchestrator

      - name: Find repositories with open issues
        id: remediation
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          REPOS_JSON: ${{ needs.discover-repos.outputs.matrix }}
          LOOKUP_CONCURRENCY: 8
        run: bash .orchestrator/.github/scripts/discover-remediation.sh

  # ===========================================================================
  # PHASE 2: OPENHANDS REMEDIATION & DRAFT PR CREATION
  # ===========================================================================
  resolve-issues:
    needs: [find-remediation]
    if: needs.find-remediation.outputs.has_work == 'true'
    name: remediate ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per repository, but cap how many agents run at once so a large
      # backlog cannot consume every runner and API quota in a single burst.
      max-parallel: 1
      matrix: ${{ fromJson(needs.find-remediation.outputs.matrix) }}
    # An agent conversation can stall indefinitely; cap it so one repository
    # cannot hold the serialized queue until the 6-hour job limit.
    timeout-minutes: 45

    steps:
      - name: Checkout health-check tooling
        uses: actions/checkout@v7.0.1
        with:
          path: .orchestrator

      # The OpenHands 1.x CLI is a Python tool; the script installs it in this
      # job and runs it directly in the repository checkout.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"

      - name: Run OpenHands remediation
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini/gemini-3.5-flash-lite
          LLM_NUM_RETRIES: "8"
          LLM_RETRY_MIN_WAIT: "5"
          LLM_RETRY_MAX_WAIT: "60"
          LLM_RETRY_MULTIPLIER: "2"
          REPO: ${{ matrix.repo }}
          ISSUE: ${{ matrix.issue }}
        run: bash .orchestrator/.github/scripts/remediate-issue.sh
