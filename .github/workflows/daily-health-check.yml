name: Two-Phase Polyglot Health Check

on:
  #schedule:
   # - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch: # Allows manual run from GitHub Actions UI

permissions:
  contents: read

jobs:
  # ===========================================================================
  # DISCOVERY: Fetch Non-Archived Repositories
  # ===========================================================================
  discover-repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch repository list via GitHub API
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          # --jq '.[]' emits one line per repo, which keeps --paginate output valid.
          REPOS=$(gh api user/repos --paginate \
            --jq '.[] | select(.archived == false and .fork == false) | .full_name')
          MATRIX=$(jq -nc --arg repos "$REPOS" '{
            repo: ($repos | split("\n") | map(select(length > 0)))
          }')
          COUNT=$(jq '.repo | length' <<<"$MATRIX")
          echo "Discovered $COUNT repositories"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No auditable repositories discovered; refusing to run an empty matrix"
            exit 1
          fi
          if [ "$COUNT" -gt 256 ]; then
            echo "::warning::Truncating matrix to 256 repositories (GitHub job limit)"
            MATRIX=$(jq -c '.repo |= .[:256]' <<<"$MATRIX")
            COUNT=256
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # PHASE 1: AUDIT & ISSUE CREATION
  # ===========================================================================
  audit-and-raise-issues:
    name: audit ${{ matrix.repo }}
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-repos.outputs.matrix) }}

    steps:
      # The audit logic lives in this repo so it can be run and tested locally.
      - name: Checkout health-check tooling
        uses: actions/checkout@v4
        with:
          path: .orchestrator

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          path: target

      - name: Run audit sensors and raise issue
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          REPO: ${{ matrix.repo }}
          TARGET_DIR: ${{ github.workspace }}/target
          AUDIT_RECORD_DIR: ${{ github.workspace }}/audit-records
        run: bash .orchestrator/.github/scripts/audit-repo.sh

      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-record-${{ strategy.job-index }}
          path: ${{ github.workspace }}/audit-records
          if-no-files-found: warn
          retention-days: 1

  # ===========================================================================
  # SUMMARY: Cross-Repo Inventory Report
  # ===========================================================================
  report:
    name: summary
    needs: [discover-repos, audit-and-raise-issues]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout health-check tooling
        uses: actions/checkout@v4
        with:
          path: .orchestrator

      # Advisory input only: a run with no records still renders a summary.
      - name: Collect audit records
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: audit-record-*
          path: audit-records
          merge-multiple: true

      - name: Write run summary
        run: bash .orchestrator/.github/scripts/render-report.sh audit-records >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # PHASE 2: OPENHANDS REMEDIATION & DRAFT PR CREATION
  # ===========================================================================
  resolve-issues:
    needs: [discover-repos, audit-and-raise-issues]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-repos.outputs.matrix) }}

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          fetch-depth: 0

      # Fix: Removed cache: 'sbt' so setup-java doesn't fail on non-Scala repos
      - name: Setup Java/Scala
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node/TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Fetch Issue Context & Execute OpenHands
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO: ${{ matrix.repo }}
        run: |
          # Fetch open automated-health issue
          ISSUE_DATA=$(gh issue list --repo "$TARGET_REPO" --label "automated-health" --state "open" --json number,body --jq '.[0]' 2>/dev/null || echo "")
          
          if [[ -z "$ISSUE_DATA" || "$ISSUE_DATA" == "null" ]]; then
            echo "No open health issue found for $TARGET_REPO. Skipping OpenHands execution."
            exit 0
          fi

          ISSUE_NUM=$(echo "$ISSUE_DATA" | jq -r '.number // empty')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // empty')

          if [[ -z "$ISSUE_NUM" ]]; then
            echo "Could not parse valid issue number for $TARGET_REPO. Skipping."
            exit 0
          fi

          BRANCH_NAME="health/fix-issue-$ISSUE_NUM"

          # Idempotence: skip if PR branch already exists on remote
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists on remote. Skipping execution."
            exit 0
          fi

          git checkout -b "$BRANCH_NAME"
          echo "$ISSUE_BODY" > .issue-context.md

          # Run OpenHands in headless mode using Gemini 3.7 Flash
          # The agent runs in a sandbox container, so the app container needs the
          # host Docker socket, and SANDBOX_VOLUMES must name the *host* workspace
          # path: "$(pwd)" is /workspace inside the container and would mount an
          # empty directory into the sandbox.
          # The app also writes its config (JWT secret) to /.openhands as the
          # sandbox uid, so that path has to be a writable host directory.
          mkdir -p "$HOME/.openhands"
          docker run --rm \
            -e LLM_API_KEY="$GEMINI_API_KEY" \
            -e LLM_MODEL="gemini/gemini-3.7-flash" \
            -e SANDBOX_USER_ID="$(id -u)" \
            -e SANDBOX_VOLUMES="${{ github.workspace }}:/workspace:rw" \
            -e SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:0.59-nikolaik \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.openhands:/.openhands" \
            -v "$(pwd):/workspace" \
            --add-host host.docker.internal:host-gateway \
            ghcr.io/all-hands-ai/openhands@sha256:00968de77a7b36546413e1f3b5c6b4e2c387d19ade54de7926e10f5b3d265fa6 \
            python -m openhands.core.main \
              -t "Read .issue-context.md and address all technical vulnerabilities, CodeQL warnings, dependency updates, and GitHub Actions workflow issues mentioned. If workflows are flagged, update action versions in .github/workflows/*.yml to the latest releases. Do not hand-edit .github/workflows/actions.lock: the pipeline regenerates it with 'gh actions-lock' after your edits. If the repo has no lockfile, use full 40-character commit SHAs for any action reference you add or change. If .issue-context.md indicates the repo is an Archival Candidate, ignore routine package updates. Run native test suites ('sbt test', 'npm test', 'pytest', or 'shellcheck *.sh') to verify cleanly."

          rm -f .issue-context.md

          # Keep an existing workflow lockfile in sync with the workflows OpenHands
          # edited. Repos without a lockfile are left alone: adopting the lockfile is
          # a policy decision, not a per-PR side effect.
          if [ -f .github/workflows/actions.lock ] && \
             git status --porcelain -- .github/workflows | grep -qE '\.ya?ml$'; then
            echo "Regenerating .github/workflows/actions.lock..."
            gh extension install github/gh-actions-lock >/dev/null 2>&1 || true
            gh actions-lock || echo "::warning::gh actions-lock failed; the lockfile may be stale"
          fi

          # Check if OpenHands generated modifications
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix(health): automated OpenHands resolution for issue #$ISSUE_NUM"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --repo "$TARGET_REPO" \
              --head "$BRANCH_NAME" \
              --title "🤖 [PR] Resolve Health Issue #$ISSUE_NUM" \
              --body "### Automated Maintenance Fixes
            Generated by OpenHands using **Gemini 3.7 Flash**.

            **Closes #$ISSUE_NUM**

            **Verification Status:**
            - [x] Examined requirements from Issue #$ISSUE_NUM
            - [x] Audited and updated GitHub Actions workflows
            - [x] Applied safe dependency and code vulnerability patches
            - [x] Verified native build and unit test execution

            Please inspect the diff and approve." \
              --draft
          else
            echo "OpenHands completed without generating code diffs for Issue #$ISSUE_NUM."
          fi
