name: Verify OpenHands Gemini Config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - name: Install pinned OpenHands CLI
        run: uv tool install "openhands==1.16.0" --python 3.12

      - name: Generate and verify temporary agent config
        env:
          LLM_API_KEY: test-config-only-not-a-real-key
          LLM_MODEL: gemini/gemini-3.8-flash
          OPENHANDS_PERSISTENCE_DIR: ${{ runner.temp }}/openhands-config-check
        run: |
          set -euo pipefail
          python="$(uv tool dir)/openhands/bin/python"
          "$python" .github/scripts/configure-openhands-agent.py
          test "$(stat -c '%a' "$OPENHANDS_PERSISTENCE_DIR")" = 700
          test "$(stat -c '%a' "$OPENHANDS_PERSISTENCE_DIR/agent_settings.json")" = 600
          rm -rf -- "$OPENHANDS_PERSISTENCE_DIR"
